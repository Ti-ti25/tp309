# ACL Mosquitto de la messagerie.
# Les lignes "topic" placées avant toute ligne "user" s'appliquent aux
# clients anonymes ; les lignes "pattern" s'appliquent à tous les clients
# (%c est remplacé par le client-id MQTT).

# --- clients anonymes ---------------------------------------------------
topic read mail/+/presence/#
topic read mail/+/server/status

pattern read  mail/+/client/%c/#
pattern write mail/+/server/request/%c
pattern write mail/+/server/disconnect/%c

# --- serveurs de messagerie ------------------------------------------------
user serveur
topic readwrite mail/#

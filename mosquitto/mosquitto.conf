# ---------------------------------------------------------------------------
# Configuration Mosquitto "simple" (développement / démo en salle de TP)
#   mosquitto -c mosquitto/mosquitto.conf -v
# Tous les clients sont anonymes et peuvent tout lire / écrire.
# ---------------------------------------------------------------------------
listener 1883
allow_anonymous true

# Taille maximale d'un message (pièces jointes en base64 : 10 Mo -> ~14 Mo)
message_size_limit 20000000

# Conservation des sessions persistantes (clean_session=False) du serveur
# de messagerie entre deux redémarrages du broker.
persistence true
persistence_location /tmp/

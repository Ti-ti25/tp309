# ---------------------------------------------------------------------------
# Configuration Mosquitto "sécurisée" : ACL + compte pour les serveurs.
#   ./lancer_broker.sh securise
# (le script remplace @REP@ par le chemin absolu du dossier mosquitto/)
#
#  - les serveurs de messagerie s'authentifient (compte "serveur")
#    et ont tous les droits sur mail/# ;
#  - les clients restent anonymes mais, grâce aux ACL "pattern" basées sur
#    leur client-id (%c), ils ne peuvent :
#      * lire que leurs propres réponses / événements,
#      * publier des requêtes que sur leur propre topic,
#      * lire les présences et l'état des serveurs.
#    Un client ne peut donc ni espionner les mails des autres (pas de
#    souscription à mail/#), ni se faire passer pour un autre client.
# ---------------------------------------------------------------------------
listener 1883
allow_anonymous true
password_file @REP@/passwd
acl_file @REP@/acl.conf
message_size_limit 20000000
persistence true
persistence_location /tmp/
